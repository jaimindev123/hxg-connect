# Production: one server. Caddy (HTTPS) → app → Postgres, plus nightly backups.
# Start: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hxg_connect
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 30 }
    # No "ports:" on purpose. The database is never reachable from the internet.

  api:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_OWNER_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/hxg_connect
    command: sh -c "node scripts/migrate.mjs && node dist/main.js"
    volumes: [uploads:/app/storage]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment: { ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [./backups:/backups, uploads:/uploads:ro, ./deploy/backup.sh:/backup.sh:ro]
    entrypoint: ["sh", "/backup.sh"]

volumes: { pgdata: {}, uploads: {}, caddy_data: {}, caddy_config: {} }
